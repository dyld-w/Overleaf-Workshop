# .github/workflows/build-and-release.yml
name: Build & Release VSIX

on:
  push:
    branches: [build-and-release]
  pull_request:
    branches: [build-and-release]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write # needed for creating releases & uploading assets

jobs:
  build_and_release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: |
          npm ci
          if [ -d "views/chat-view" ]; then (cd views/chat-view && npm ci); fi

      - name: Install vsce
        run: npm i -g @vscode/vsce

      - name: Package VSIX (+ checksum)
        id: pkg
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          BASE_VERSION=$(jq -r '.version' package.json)
          jq --arg v "${BASE_VERSION}-${SHORT_SHA}" '.version=$v' package.json > package.tmp && mv package.tmp package.json

          vsce package --out dist/
          mv dist/*.vsix overleaf-workshop-enhanced.vsix
          sha256sum overleaf-workshop-enhanced.vsix > overleaf-workshop-enhanced.vsix.sha256

      # Only create a release on pushes (not on PRs)
      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            overleaf-workshop-enhanced.vsix
            overleaf-workshop-enhanced.vsix.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
