# .github/workflows/build-and-release.yml
name: Build & Release VSIX

on:
  push:
    branches: [build-and-release]
  pull_request:
    branches: [build-and-release]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write  # needed for creating releases & uploading assets

jobs:
  build_and_release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: |
          npm ci
          if [ -d "views/chat-view" ]; then (cd views/chat-view && npm ci); fi

      - name: Install vsce
        run: npm i -g @vscode/vsce

      - name: Package VSIX (+ checksum)
        id: pkg
        shell: bash
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          BASE_VERSION=$(jq -r '.version' package.json)
          jq --arg v "${BASE_VERSION}-${SHORT_SHA}" '.version=$v' package.json > package.tmp && mv package.tmp package.json

          # Build; outputs a single *.vsix in cwd (no --out flag)
          vsce package

          # Find the generated file
          GEN_VSIX=$(ls -1 *.vsix | tail -n1)

          # Make a stable-named copy for the releases/latest URL
          STABLE_VSIX="overleaf-workshop-enhanced.vsix"
          cp "$GEN_VSIX" "$STABLE_VSIX"

          # Checksum the stable file
          sha256sum "$STABLE_VSIX" > "${STABLE_VSIX}.sha256"

          echo "gen=$GEN_VSIX" >> "$GITHUB_OUTPUT"
          echo "stable=$STABLE_VSIX" >> "$GITHUB_OUTPUT"
          echo "stable_sha=${STABLE_VSIX}.sha256" >> "$GITHUB_OUTPUT"

      # Optional: upload artifacts for PRs and for debugging
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vsix-build-${{ github.run_id }}
          path: |
            ${{ steps.pkg.outputs.gen }}
            ${{ steps.pkg.outputs.stable }}
            ${{ steps.pkg.outputs.stable_sha }}

      # Only create a Release on pushes (not on PRs)
      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.pkg.outputs.stable }}
            ${{ steps.pkg.outputs.stable_sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
